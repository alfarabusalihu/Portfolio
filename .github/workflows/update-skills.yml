name: Auto-Update Skills from CV

on:
  schedule:
    # Run at 00:00 on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allow manual trigger button

jobs:
  update-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push changes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run AI Update Script
        env:
          # Google Services
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          
          # GitHub
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          TOKEN_GIT: ${{ secrets.TOKEN_GIT }}
          
          # AI Services (Gemini)
          GEMINI_API_KEY_CV: ${{ secrets.GEMINI_API_KEY_CV }}
          GEMINI_API_KEY_AUDIO: ${{ secrets.GEMINI_API_KEY_AUDIO }}
          
          # ElevenLabs TTS
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
          # Optional
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          
          # Flags
          GENERATE_AUDIO: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          echo "🔍 Validating environment variables..."
          
          # Check Google Drive
          if [ -z "$GOOGLE_API_KEY" ]; then echo "❌ GOOGLE_API_KEY missing"; exit 1; fi
          if [ -z "$DRIVE_FOLDER_ID" ]; then echo "❌ DRIVE_FOLDER_ID missing"; exit 1; fi
          
          # Check GitHub
          if [ -z "$GITHUB_USERNAME" ]; then echo "❌ GITHUB_USERNAME missing"; exit 1; fi
          if [ -z "$TOKEN_GIT" ]; then echo "❌ TOKEN_GIT missing"; exit 1; fi
          
          # Check Gemini (both keys required)
          if [ -z "$GEMINI_API_KEY_CV" ]; then echo "❌ GEMINI_API_KEY_CV missing"; exit 1; fi
          if [ -z "$GEMINI_API_KEY_AUDIO" ]; then echo "❌ GEMINI_API_KEY_AUDIO missing"; exit 1; fi
          
          # Check ElevenLabs
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "❌ ELEVENLABS_API_KEY missing"; exit 1; fi
          
          # Check Supabase
          if [ -z "$SUPABASE_URL" ]; then echo "❌ SUPABASE_URL missing"; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "❌ SUPABASE_SERVICE_ROLE_KEY missing"; exit 1; fi
          
          echo "✅ All required environment variables present"
          echo "🚀 Starting monthly sync with audio generation..."
          
          node scripts/update-cv-data.js

      - name: Done
        run: echo "✅ Sync complete — data synced to Supabase"
